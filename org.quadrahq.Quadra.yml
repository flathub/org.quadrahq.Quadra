
app-id: org.quadrahq.Quadra
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: quadra
cleanup:
  - /share/doc
  - /share/man
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/app/com.discordapp.DiscordCanary:create
  - --filesystem=xdg-run/app/dev.vencord.Vesktop:create
  - --filesystem=xdg-run/.flatpak/dev.vencord.Vesktop:create
  - --filesystem=xdg-run/snap.discord:create
  - --filesystem=xdg-data/butter/runners:ro
  - --filesystem=~/.var/app/io.github.microlift.butter/data/butter/runners:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: quadra
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/quadra/cargo
    build-commands:
      - |
        export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-rpath,/app/lib64 -C link-arg=-Wl,-rpath,/app/lib"
        cargo --offline build --release --locked
      - install -Dm755 target/release/quadra -t /app/bin/
      - install -Dm644 LICENSE -t /app/share/licenses/quadra/
      - install -Dm644 data/icons/org.quadrahq.Quadra.png -t /app/share/icons/hicolor/256x256/apps/
      - install -Dm644 flatpak/org.quadrahq.Quadra.desktop -t /app/share/applications/
      - install -Dm644 flatpak/org.quadrahq.Quadra.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/QuadraHQ/quadra.git
        tag: v0.50.0
        commit: 38621054f101ef0e5749d10370ea0f4e8a0514b8
      - cargo-sources.json
